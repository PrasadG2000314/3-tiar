services:
  # 1. Database Container (MongoDB)
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"

  # 2. Backend Container (Node.js Express)
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/hospital_management
    depends_on:
      - mongodb

  # 3. Frontend Container (React Vite)
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

